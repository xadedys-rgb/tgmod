name: Build APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: SDK NDK CMake
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          SDKMANAGER=$(ls $ANDROID_HOME/cmdline-tools/*/bin/sdkmanager | head -n1)
          echo "Использую: $SDKMANAGER"
          "$SDKMANAGER" --version || true
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018" "cmake;3.22.1" || true

      - name: Скачать сабмодули
        run: |
          p=""; u=""
          while read -r line; do
            case "$line" in
              *"path = "*) p="${line#*path = }";;
              *"url = "*)  u="${line#*url = }";;
            esac
            if [ -n "$p" ] && [ -n "$u" ]; then
              if [ "$p" = "TMessagesProj_Modules/media" ]; then
                echo "=== media клонирую с историей: $u -> $p"
                rm -rf "$p"
                git clone "$u" "$p"
              else
                echo "=== $u -> $p"
                rm -rf "$p"
                git clone --depth=1 "$u" "$p"
              fi
              p=""; u=""
            fi
          done < .gitmodules

      - name: Media-модуль совместимая версия
        run: |
          cd TMessagesProj_Modules/media
          FOUND=""
          for c in $(git log --all --format=%H -- core_settings.gradle); do
            if ! git cat-file -e "$c:core_settings.gradle" 2>/dev/null; then
              continue
            fi
            if git grep -q "kotlin.plugin.compose" "$c" 2>/dev/null; then
              echo "Пропускаю $c (слишком новый — требует kotlin.plugin.compose)"
              continue
            fi
            FOUND="$c"
            break
          done
          if [ -n "$FOUND" ]; then
            echo "Откат media на совместимый коммит: $FOUND"
            git log -1 --oneline "$FOUND"
            git checkout "$FOUND"
          else
            echo "Совместимый коммит не найден — вырезаю kotlin.plugin.compose из файлов"
            for c in $(git log --all --format=%H -- core_settings.gradle); do
              if git cat-file -e "$c:core_settings.gradle" 2>/dev/null; then
                git checkout "$c"
                break
              fi
            done
            grep -rl "org.jetbrains.kotlin.plugin.compose" . | xargs -r sed -i '/org.jetbrains.kotlin.plugin.compose/d'
          fi

      - name: Keystore
        run: |
          cd TMessagesProj
          keytool -genkeypair -v -keystore config/debug.keystore -storepass telegram -keypass telegram -alias telegram -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Debug, O=Debug, C=US"
          printf 'STORE_FILE=debug.keystore\nSTORE_PASSWORD=telegram\nKEY_ALIAS=telegram\nKEY_PASSWORD=telegram\n' > config/keystore.properties

      - name: Сборка
        run: |
          chmod +x gradlew
          ./gradlew :TMessagesProj_App:assembleAfatDebug --no-daemon

      - name: APK
        uses: actions/upload-artifact@v4
        with:
          name: telegram-mod-apk
          path: "**/build/outputs/apk/**/*.apk"
          if-no-files-found: error
