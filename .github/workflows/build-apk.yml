name: Build APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: SDK NDK CMake
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          SDKMANAGER=$(ls $ANDROID_HOME/cmdline-tools/*/bin/sdkmanager | head -n1)
          echo "Использую: $SDKMANAGER"
          "$SDKMANAGER" --version || true
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018" "cmake;3.22.1" || true
          echo "=== проверка установки ==="
          ls $ANDROID_HOME

      - name: Скачать сабмодули
        run: |
          p=""; u=""
          while read -r line; do
            case "$line" in
              *"path = "*) p="${line#*path = }";;
              *"url = "*)  u="${line#*url = }";;
            esac
            if [ -n "$p" ] && [ -n "$u" ]; then
              echo "=== $u -> $p"
              rm -rf "$p"
              git clone --depth=1 "$u" "$p"
              p=""; u=""
            fi
          done < .gitmodules

      - name: Media-модуль совместимая версия
        run: |
          if [ ! -d TMessagesProj_Modules/media ]; then
            git clone https://github.com/Arseny271/media.git TMessagesProj_Modules/media
          fi
          cd TMessagesProj_Modules/media
          if [ -f core_settings.gradle ]; then
            echo "OK: core_settings.gradle есть"
          else
            echo "Ищу последнюю версию с core_settings.gradle"
            git fetch --unshallow 2>/dev/null || git fetch 2>/dev/null || true
            FOUND=""
            for c in $(git log --all --format=%H -- core_settings.gradle); do
              if git cat-file -e "$c:core_settings.gradle" 2>/dev/null; then
                FOUND="$c"
                break
              fi
            done
            if [ -n "$FOUND" ]; then
              echo "Откат на коммит $FOUND"
              git checkout "$FOUND"
            else
              echo "НЕТ ПОДХОДЯЩЕГО КОММИТА. Содержимое media:"
              ls -la
              exit 1
            fi
          fi
          echo "=== Содержимое media:"
          ls

      - name: Keystore
        run: |
          cd TMessagesProj
          keytool -genkeypair -v -keystore config/debug.keystore -storepass telegram -keypass telegram -alias telegram -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Debug, O=Debug, C=US"
          printf 'STORE_FILE=debug.keystore\nSTORE_PASSWORD=telegram\nKEY_ALIAS=telegram\nKEY_PASSWORD=telegram\n' > config/keystore.properties

      - name: Сборка
        run: |
          chmod +x gradlew
          ./gradlew assembleArm64Debug --no-daemon || ./gradlew assembleAfatDebug --no-daemon

      - name: APK
        uses: actions/upload-artifact@v4
        with:
          name: telegram-mod-apk
          path: "**/build/outputs/apk/**/*.apk"
          if-no-files-found: error
