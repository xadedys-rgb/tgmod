name: Build APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 350

    steps:
      - name: Checkout mod source
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK, NDK and CMake
        shell: bash
        run: |
          set -euo pipefail

          export ANDROID_HOME=/usr/local/lib/android/sdk
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n1)

          yes | "$SDKMANAGER" --licenses >/dev/null || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.2.12479018" \
            "cmake;3.22.1"

      - name: Restore exact Telegram submodule versions
        shell: bash
        run: |
          set -euo pipefail

          UPSTREAM="$RUNNER_TEMP/telegram-upstream"
          export UPSTREAM

          git clone \
            https://github.com/DrKLO/Telegram.git \
            "$UPSTREAM"

          cd "$UPSTREAM"

          git checkout --detach 3de37c8
          git submodule update --init --recursive

          echo "Upstream commit:"
          git rev-parse HEAD

          echo "Copy exact submodule revisions"

          git config -f .gitmodules --get-regexp '\.path$' \
            | while read -r module_path path; do
                echo "Copying: $path"

                rm -rf "$GITHUB_WORKSPACE/$path"
                mkdir -p "$(dirname "$GITHUB_WORKSPACE/$path")"

                cp -a "$UPSTREAM/$path" "$GITHUB_WORKSPACE/$path"
              done

          cd "$GITHUB_WORKSPACE"

          test -f TMessagesProj_Modules/media/core_settings.gradle
          test -f TMessagesProj/jni/third_party/absl/absl/base/nullability.h
          test -f TMessagesProj/jni/voip/webrtc/api/environment/environment.h
          test -f TMessagesProj/jni/tgcalls/tgcalls/ChannelManager.cpp

          echo "All exact submodules are present"
          echo "media/core_settings.gradle: OK"
          echo "absl/nullability.h: OK"
          echo "webrtc: OK"
          echo "tgcalls: OK"

      - name: Verify release keystore
        shell: bash
        run: |
          set -euo pipefail

          test -f TMessagesProj/config/release.keystore

      - name: Build APK
        shell: bash
        run: |
          set -euo pipefail

          chmod +x gradlew

          ./gradlew :TMessagesProj_App:assembleAfatDebug \
            --no-daemon \
            --max-workers=2 \
            -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8" \
            --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: telegram-mod-apk
          path: TMessagesProj_App/build/outputs/apk/**/*.apk
          if-no-files-found: error
