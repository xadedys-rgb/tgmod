name: Build APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 350

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: SDK NDK CMake
        shell: bash
        run: |
          set -e
          export ANDROID_HOME=/usr/local/lib/android/sdk
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n1)
          echo "Использую: $SDKMANAGER"
          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.2.12479018" \
            "cmake;3.22.1"
          yes | "$SDKMANAGER" --licenses >/dev/null || true

      - name: Скачать сабмодули в версиях исходного Telegram
        shell: bash
        run: |
          set -eo pipefail

          rm -rf "$RUNNER_TEMP/telegram-upstream"
          git clone --no-checkout --filter=blob:none \
            https://github.com/DrKLO/Telegram.git \
            "$RUNNER_TEMP/telegram-upstream"

          reference=TMessagesProj/jni/voip/webrtc/api/environment/environment.h
          wanted=$(git hash-object "$reference")
          revision=""
          while read -r commit; do
            actual=$(git -C "$RUNNER_TEMP/telegram-upstream" rev-parse "$commit:$reference" 2>/dev/null || true)
            if [ "$actual" = "$wanted" ]; then
              revision="$commit"
              break
            fi
          done < <(git -C "$RUNNER_TEMP/telegram-upstream" log --all --format=%H -- "$reference")

          if [ -z "$revision" ]; then
            echo "::error::Не найден исходный коммит Telegram с файлом $reference"
            exit 1
          fi
          echo "Исходный коммит Telegram: $revision"

          git -C "$RUNNER_TEMP/telegram-upstream" checkout --detach "$revision"

          echo "::group::Список сабмодулей на этом коммите"
          git -C "$RUNNER_TEMP/telegram-upstream" config --file .gitmodules --get-regexp path || echo "(.gitmodules отсутствует или пуст)"
          echo "::endgroup::"

          git -C "$RUNNER_TEMP/telegram-upstream" submodule update --init --recursive --progress

          git -C "$RUNNER_TEMP/telegram-upstream" \
            submodule foreach --recursive --quiet 'printf "%s\n" "$sm_path"' > "$RUNNER_TEMP/submodule-paths"

          echo "::group::Пути сабмодулей, которые будут скопированы"
          cat "$RUNNER_TEMP/submodule-paths" || true
          echo "::endgroup::"

          if [ ! -s "$RUNNER_TEMP/submodule-paths" ]; then
            echo "::error::Список путей сабмодулей пуст — нечего копировать"
            exit 1
          fi

          while read -r path; do
            [ -z "$path" ] && continue
            src="$RUNNER_TEMP/telegram-upstream/$path"
            if [ ! -e "$src" ]; then
              echo "::error::В upstream-репозитории нет пути: $path"
              exit 1
            fi
            echo "Копирую точную upstream-версию: $path"
            rm -rf "$path"
            mkdir -p "$(dirname "$path")"
            cp -a "$src" "$path"
          done < "$RUNNER_TEMP/submodule-paths"

          echo "::group::Проверка критичных файлов"
          if [ ! -f TMessagesProj_Modules/media/core_settings.gradle ]; then
            echo "::error::Не найден файл TMessagesProj_Modules/media/core_settings.gradle после копирования сабмодулей"
            echo "Содержимое TMessagesProj_Modules (если есть):"
            find TMessagesProj_Modules -maxdepth 3 2>/dev/null || echo "(каталог TMessagesProj_Modules отсутствует)"
            exit 1
          fi

          if [ ! -f TMessagesProj/config/release.keystore ]; then
            echo "::error::Нет тестового ключа TMessagesProj/config/release.keystore"
            find TMessagesProj/config -maxdepth 2 2>/dev/null || echo "(каталог TMessagesProj/config отсутствует)"
            exit 1
          fi
          echo "Все критичные файлы на месте"
          echo "::endgroup::"

      - name: Сборка
        shell: bash
        run: |
          set -e
          chmod +x gradlew
          ./gradlew :TMessagesProj_App:assembleAfatDebug --no-daemon --max-workers=2 \
            -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8" --stacktrace

      - name: APK
        uses: actions/upload-artifact@v4
        with:
          name: telegram-mod-apk
          path: "**/build/outputs/apk/**/*.apk"
          if-no-files-found: error
