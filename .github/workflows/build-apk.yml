name: Build APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 350

    steps:
      - name: Скачать проект
        uses: actions/checkout@v4

      - name: Установить Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Установить Android SDK, NDK и CMake
        shell: bash
        run: |
          set -e

          export ANDROID_HOME=/usr/local/lib/android/sdk

          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" \
            -name sdkmanager -type f | head -n 1)

          if [ -z "$SDKMANAGER" ]; then
            echo "Не найден sdkmanager"
            exit 1
          fi

          echo "Использую: $SDKMANAGER"

          yes | "$SDKMANAGER" --licenses >/dev/null || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.2.12479018" \
            "cmake;3.22.1"

      - name: Скачать зависимости
        shell: bash
        run: |
          set -euo pipefail

          while read -r key path; do
            name="${key%.path}"
            url="$(git config -f .gitmodules --get "${name}.url")"

            echo "=== $path <- $url"

            # Это чистая временная копия на GitHub runner.
            rm -rf -- "$path"
            mkdir -p "$(dirname "$path")"

            if [ "$path" = "TMessagesProj_Modules/media" ]; then
              git clone "$url" "$path"
              git -C "$path" checkout --detach \
                56281d3402ddfae80fe1ed372593172c453e4eaa
            else
              git clone --depth=1 "$url" "$path"
            fi
          done < <(
            git config -f .gitmodules \
              --get-regexp '^submodule\..*\.path$'
          )

          echo "=== Проверка зависимостей"

          test -f TMessagesProj_Modules/media/core_settings.gradle || {
            echo "Нет файла media/core_settings.gradle"
            exit 1
          }

          test -f TMessagesProj/jni/third_party/absl/absl/base/nullability.h || {
            echo "Нет файла absl/base/nullability.h"
            exit 1
          }

          test -f TMessagesProj/config/release.keystore || {
            echo "Нет файла TMessagesProj/config/release.keystore"
            exit 1
          }

          echo "Основные файлы найдены"

      - name: Совместимость WebRTC и Abseil
        shell: bash
        run: |
          set -euo pipefail

          cat > TMessagesProj/jni/third_party/absl/absl/base/nullability_compat.h <<'EOF'
          #ifndef TELEGRAM_NULLABILITY_COMPAT_H_
          #define TELEGRAM_NULLABILITY_COMPAT_H_

          #include "absl/base/nullability.h"

          namespace absl {
          template <typename T>
          using Nonnull = T;

          template <typename T>
          using Nullable = T;
          }

          #endif
          EOF

          python3 - <<'PY'
          from pathlib import Path

          root = Path("TMessagesProj/jni/voip/webrtc")
          count = 0

          for path in root.rglob("*"):
              if path.suffix not in (".h", ".cc", ".cpp"):
                  continue

              data = path.read_bytes()

              if b"absl::Nonnull<" not in data and b"absl::Nullable<" not in data:
                  continue

              path.write_bytes(
                  b'#include "absl/base/nullability_compat.h"\n' + data
              )

              print("Исправлен:", path)
              count += 1

          if count == 0:
              raise SystemExit(
                  "Не найдены файлы WebRTC с Nonnull/Nullable"
              )

          print("Исправлено файлов:", count)
          PY

      - name: Собрать APK
        shell: bash
        run: |
          set -euo pipefail

          chmod +x gradlew

          ./gradlew :TMessagesProj_App:assembleAfatDebug \
            --no-daemon \
            --max-workers=2 \
            -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8" \
            --stacktrace

      - name: Сохранить APK
        uses: actions/upload-artifact@v4
        with:
          name: telegram-mod-apk
          path: TMessagesProj_App/build/outputs/apk/**/*.apk
          if-no-files-found: error
