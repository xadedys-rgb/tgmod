name: Build APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: SDK NDK CMake
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Скачать сабмодули
        run: |
          p=""; u=""
          while read -r line; do
            case "$line" in
              *"path = "*) p="${line#*path = }";;
              *"url = "*)  u="${line#*url = }";;
            esac
            if [ -n "$p" ] && [ -n "$u" ]; then
              echo "=== $u -> $p"
              rm -rf "$p"
              git clone --depth=1 "$u" "$p"
              p=""; u=""
            fi
          done < .gitmodules

      - name: Keystore
        run: |
          if [ ! -f TMessagesProj/config ]; then
            cd TMessagesProj
            keytool -genkeypair -v -keystore debug.keystore -storepass telegram -keypass telegram -alias telegram -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Debug, O=Debug, C=US"
            printf 'STORE_FILE=debug.keystore\nSTORE_PASSWORD=telegram\nKEY_ALIAS=telegram\nKEY_PASSWORD=telegram\n' > config
          fi

      - name: Сборка
        run: |
          chmod +x gradlew
          ./gradlew assembleArm64Debug --no-daemon || ./gradlew assembleAfatDebug --no-daemon

      - name: APK
        uses: actions/upload-artifact@v4
        with:
          name: telegram-mod-apk
          path: "**/build/outputs/apk/**/*.apk"
          if-no-files-found: error
