name: Build APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 350

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: SDK NDK CMake
        shell: bash
        run: |
          set -e
          export ANDROID_HOME=/usr/local/lib/android/sdk
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n1)
          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.2.12479018" \
            "cmake;3.22.1"
          yes | "$SDKMANAGER" --licenses >/dev/null || true

      - name: Скачать сабмодули в версиях исходного Telegram
        shell: bash
        run: |
          set -eo pipefail

          test -f .gitmodules || exit 1

          rm -rf "$RUNNER_TEMP/telegram-upstream"
          git clone --filter=blob:none \
            https://github.com/DrKLO/Telegram.git \
            "$RUNNER_TEMP/telegram-upstream"

          reference=TMessagesProj/jni/voip/webrtc/api/environment/environment.h
          wanted=$(git hash-object "$reference")
          revision=""
          while read -r commit; do
            actual=$(git -C "$RUNNER_TEMP/telegram-upstream" rev-parse "$commit:$reference" 2>/dev/null || true)
            if [ "$actual" = "$wanted" ]; then
              revision="$commit"
              break
            fi
          done < <(git -C "$RUNNER_TEMP/telegram-upstream" log --all --format=%H -- "$reference")

          [ -n "$revision" ] || exit 1

          git -C "$RUNNER_TEMP/telegram-upstream" checkout --detach "$revision"
          git -C "$RUNNER_TEMP/telegram-upstream" submodule update --init --recursive --progress || true

          mapfile -t paths < <(git config --file .gitmodules --get-regexp path | awk '{print $2}')
          [ "${#paths[@]}" -gt 0 ] || exit 1

          for path in "${paths[@]}"; do
            [ -z "$path" ] && continue
            src="$RUNNER_TEMP/telegram-upstream/$path"

            if [ -e "$src" ] && [ -n "$(ls -A "$src" 2>/dev/null)" ]; then
              rm -rf "$path"
              mkdir -p "$(dirname "$path")"
              cp -a "$src" "$path"
            else
              git submodule update --init -- "$path"
              [ -e "$path" ] && [ -n "$(ls -A "$path" 2>/dev/null)" ] || exit 1
            fi
          done

          test -f TMessagesProj_Modules/media/core_settings.gradle
          test -f TMessagesProj/config/release.keystore

      - name: Сборка
        shell: bash
        run: |
          set -e
          chmod +x gradlew
          ./gradlew :TMessagesProj_App:assembleAfatDebug --no-daemon --max-workers=2 \
            -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8" --stacktrace

      - name: APK
        uses: actions/upload-artifact@v4
        with:
          name: telegram-mod-apk
          path: "**/build/outputs/apk/**/*.apk"
          if-no-files-found: error
