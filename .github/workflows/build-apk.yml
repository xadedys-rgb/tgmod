name: Build APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 350

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: SDK NDK CMake
        shell: bash
        run: |
          set -e
          export ANDROID_HOME=/usr/local/lib/android/sdk
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n1)
          echo "Использую: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.2.12479018" \
            "cmake;3.22.1"

      - name: Скачать сабмодули
        shell: bash
        run: |
          set -e
          p=""
          u=""

          while read -r line; do
            case "$line" in
              *"path = "*)
                p="${line#*path = }"
                ;;
              *"url = "*)
                u="${line#*url = }"
                ;;
            esac

            if [ -n "$p" ] && [ -n "$u" ]; then
              echo "=== $u -> $p"
              rm -rf "$p"
              mkdir -p "$(dirname "$p")"

              if [ "$p" = "TMessagesProj_Modules/media" ]; then
                git clone "$u" "$p"
              else
                git clone --depth=1 "$u" "$p"
              fi

              p=""
              u=""
            fi
          done < .gitmodules

          test -d TMessagesProj_Modules/media/.git

      - name: Media-модуль совместимая версия
        shell: bash
        run: |
          set -e
          cd TMessagesProj_Modules/media
          FOUND=""

          for c in $(git log --all --format=%H -- core_settings.gradle); do
            if ! git cat-file -e "$c:core_settings.gradle" 2>/dev/null; then
              continue
            fi

            if git grep -q "kotlin.plugin.compose" "$c" 2>/dev/null; then
              echo "Пропускаю $c: требуется kotlin.plugin.compose"
              continue
            fi

            FOUND="$c"
            break
          done

          if [ -z "$FOUND" ]; then
            echo "Совместимый коммит media не найден"
            exit 1
          fi

          echo "Использую media commit: $FOUND"
          git checkout "$FOUND"
          test -f core_settings.gradle

      - name: Keystore
        shell: bash
        run: |
          set -e
          cd TMessagesProj

          rm -f config/debug.keystore

          keytool -genkeypair \
            -v \
            -keystore config/debug.keystore \
            -storepass telegram \
            -keypass telegram \
            -alias telegram \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Debug, O=Debug, C=US"

          printf '%s\n' \
            'STORE_FILE=debug.keystore' \
            'STORE_PASSWORD=telegram' \
            'KEY_ALIAS=telegram' \
            'KEY_PASSWORD=telegram' \
            > config/keystore.properties

      - name: Совместимость WebRTC и Abseil
        shell: bash
        run: |
          set -e

          cat > TMessagesProj/jni/third_party/absl/absl/base/nullability_compat.h <<'EOF'
          #ifndef ABSL_BASE_NULLABILITY_COMPAT_H_
          #define ABSL_BASE_NULLABILITY_COMPAT_H_

          namespace absl {
          template <typename T>
          using Nonnull = T;
          }

          #endif
          EOF

          for file in \
            TMessagesProj/jni/voip/webrtc/api/environment/environment.h \
            TMessagesProj/jni/voip/webrtc/modules/audio_processing/include/audio_processing.h \
            TMessagesProj/jni/voip/webrtc/api/task_queue/pending_task_safety_flag.h
          do
            test -f "$file"
            sed -i '1i#include "absl/base/nullability_compat.h"' "$file"
            grep -q '^#include "absl/base/nullability_compat.h"' "$file"
            echo "PATCHED: $file"
            head -n 2 "$file"
          done

      - name: Сборка
        shell: bash
        run: |
          set -e
          chmod +x gradlew
          ./gradlew :TMessagesProj_App:assembleAfatDebug --no-daemon --stacktrace

      - name: APK
        uses: actions/upload-artifact@v4
        with:
          name: telegram-mod-apk
          path: "**/build/outputs/apk/**/*.apk"
          if-no-files-found: error
